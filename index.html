<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>未來學院 — 講座計畫 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0a0f; --surface:#111118; --border:#1e1e2e;
    --accent:#c8ff00; --accent2:#ff6b35; --text:#e8e8f0;
    --muted:#6b6b8a; --live:#ff3b3b; --hall:#3b8fff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Noto Serif TC',serif;overflow-x:hidden;}

  /* Header */
  header{position:relative;padding:80px 40px 60px;border-bottom:1px solid var(--border);overflow:hidden;}
  .header-grid{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:60px 60px;opacity:0.4;}
  .header-glow{position:absolute;top:-100px;left:50%;transform:translateX(-50%);width:600px;height:400px;background:radial-gradient(ellipse,rgba(200,255,0,0.08) 0%,transparent 70%);pointer-events:none;}
  .header-inner{position:relative;max-width:1100px;margin:0 auto;}
  .eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.3em;color:var(--accent);text-transform:uppercase;margin-bottom:24px;display:flex;align-items:center;gap:12px;}
  .eyebrow::before{content:'';display:block;width:32px;height:1px;background:var(--accent);}
  h1{font-size:clamp(48px,8vw,96px);font-weight:900;line-height:0.95;letter-spacing:-0.02em;color:#fff;margin-bottom:16px;}
  h1 span{color:var(--accent);display:block;}
  .subtitle{font-family:'Space Mono',monospace;font-size:13px;color:var(--muted);margin-top:24px;letter-spacing:0.05em;}
  .header-meta{display:flex;gap:32px;margin-top:40px;flex-wrap:wrap;}
  .meta-item{display:flex;flex-direction:column;gap:4px;}
  .meta-label{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.2em;color:var(--muted);text-transform:uppercase;}
  .meta-value{font-size:20px;font-weight:700;color:var(--accent);}

  /* Filter */
  .filter-wrap{max-width:1180px;margin:0 auto;}
  .filter-bar{padding:20px 40px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .filter-label{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.2em;color:var(--muted);text-transform:uppercase;margin-right:4px;}
  .filter-btn{font-family:'Space Mono',monospace;font-size:11px;padding:6px 16px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;letter-spacing:0.1em;text-transform:uppercase;transition:all 0.2s;}
  .filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(200,255,0,0.05);}

  /* Main */
  main{max-width:1100px;margin:0 auto;padding:60px 40px;}
  .events-list{display:flex;flex-direction:column;gap:2px;}

  /* Loading state */
  .loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 0;gap:20px;}
  .loading-ring{width:40px;height:40px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
  .loading-text{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.2em;color:var(--muted);}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Error state */
  .error-state{text-align:center;padding:80px 0;}
  .error-state p{font-family:'Space Mono',monospace;font-size:12px;color:var(--live);letter-spacing:0.1em;margin-bottom:16px;}
  .retry-btn{font-family:'Space Mono',monospace;font-size:11px;padding:10px 24px;border:1px solid var(--live);background:transparent;color:var(--live);cursor:pointer;letter-spacing:0.1em;text-transform:uppercase;transition:all 0.2s;}
  .retry-btn:hover{background:rgba(255,59,59,0.1);}

  /* Card */
  .event-card{position:relative;background:var(--surface);border:1px solid var(--border);overflow:hidden;transition:border-color 0.3s,transform 0.3s;cursor:pointer;animation:fadeUp 0.5s ease both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .event-card:hover{border-color:rgba(200,255,0,0.3);transform:translateX(4px);z-index:1;}
  .event-card.hidden{display:none;}
  .event-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);transform:scaleY(0);transition:transform 0.3s;transform-origin:bottom;}
  .event-card:hover::before{transform:scaleY(1);transform-origin:top;}

  .event-inner{display:grid;grid-template-columns:180px 1fr auto;align-items:stretch;}
  .event-date-col{padding:28px 24px;border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;gap:4px;}
  .event-date{font-family:'Space Mono',monospace;font-size:26px;font-weight:700;color:#fff;line-height:1;}
  .event-month-day{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:0.1em;margin-top:4px;}
  .event-time{font-family:'Space Mono',monospace;font-size:11px;color:var(--accent);margin-top:8px;letter-spacing:0.05em;}
  .event-main{padding:28px 32px;display:flex;flex-direction:column;justify-content:center;gap:10px;}
  .event-type-badge{display:inline-flex;align-items:center;gap:6px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.15em;text-transform:uppercase;width:fit-content;}
  .type-dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
  .type-live .type-dot{background:var(--live);box-shadow:0 0 8px var(--live);} .type-live{color:var(--live);}
  .type-hall .type-dot{background:var(--hall);box-shadow:0 0 8px var(--hall);} .type-hall{color:var(--hall);}
  .event-title{font-size:20px;font-weight:700;color:#fff;line-height:1.3;}
  .event-meta-row{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  .event-instructor{font-size:13px;color:var(--accent2);font-weight:700;}
  .event-location{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);}
  .event-description{font-size:13px;color:var(--muted);line-height:1.7;margin-top:4px;max-width:600px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .event-right{padding:28px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:12px;border-left:1px solid var(--border);min-width:140px;}
  .arrow-icon{color:var(--accent);font-size:18px;opacity:0;transform:translateX(-8px);transition:all 0.2s;}
  .event-card:hover .arrow-icon{opacity:1;transform:translateX(0);}
  .reg-badge{display:none;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:var(--accent);border:1px solid rgba(200,255,0,0.3);padding:3px 8px;}
  .event-card.registered .reg-badge{display:block;}

  /* Detail panel */
  .event-detail{max-height:0;overflow:hidden;transition:max-height 0.4s cubic-bezier(0.4,0,0.2,1),padding 0.3s;background:#0d0d14;}
  .event-detail.open{max-height:500px;border-top:1px solid var(--border);padding:32px 32px 32px 212px;}
  .detail-id{font-family:'Space Mono',monospace;font-size:10px;color:#3a3a55;letter-spacing:0.15em;margin-bottom:12px;}
  .detail-core{font-size:14px;color:var(--muted);line-height:1.9;max-width:640px;margin-bottom:24px;}
  .register-btn{display:inline-flex;align-items:center;gap:10px;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:0.15em;text-transform:uppercase;padding:14px 28px;background:var(--accent);color:#000;font-weight:700;border:none;cursor:pointer;transition:background 0.2s,transform 0.15s;}
  .register-btn:hover{background:#d8ff20;transform:translateY(-1px);}
  .register-btn.done{background:#1e2e0a;color:var(--accent);border:1px solid rgba(200,255,0,0.3);cursor:default;transform:none;}

  /* Week divider */
  .week-divider{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.3em;text-transform:uppercase;color:var(--muted);padding:32px 0 12px;display:flex;align-items:center;gap:16px;}
  .week-divider::after{content:'';flex:1;height:1px;background:var(--border);}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity 0.25s;}
  .modal-overlay.open{opacity:1;pointer-events:all;}
  .modal{background:var(--surface);border:1px solid var(--border);width:100%;max-width:520px;margin:20px;position:relative;transform:translateY(24px);transition:transform 0.3s;}
  .modal-overlay.open .modal{transform:translateY(0);}
  .modal-header{padding:28px 32px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;}
  .modal-label{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.2em;color:var(--accent);text-transform:uppercase;margin-bottom:6px;}
  .modal-title{font-size:17px;font-weight:700;color:#fff;line-height:1.4;max-width:360px;}
  .modal-close{background:none;border:1px solid var(--border);color:var(--muted);width:36px;height:36px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:border-color 0.2s,color 0.2s;flex-shrink:0;margin-left:16px;}
  .modal-close:hover{border-color:var(--accent);color:var(--accent);}
  .modal-body{padding:28px 32px;display:flex;flex-direction:column;gap:20px;}
  .form-group{display:flex;flex-direction:column;gap:8px;}
  .form-label{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.2em;color:var(--muted);text-transform:uppercase;}
  .form-input{background:#0a0a0f;border:1px solid var(--border);color:var(--text);padding:12px 16px;font-family:'Noto Serif TC',serif;font-size:14px;outline:none;transition:border-color 0.2s;width:100%;}
  .form-input:focus{border-color:var(--accent);}
  .form-input::placeholder{color:#3a3a55;}
  .form-input[readonly]{color:var(--muted);cursor:default;}
  .form-hint{font-family:'Space Mono',monospace;font-size:10px;color:#3a3a55;letter-spacing:0.05em;}
  .modal-footer{padding:0 32px 28px;display:flex;gap:12px;align-items:center;}
  .submit-btn{flex:1;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:0.15em;text-transform:uppercase;padding:16px;background:var(--accent);color:#000;font-weight:700;border:none;cursor:pointer;transition:background 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;}
  .submit-btn:hover:not(:disabled){background:#d8ff20;}
  .submit-btn:disabled{opacity:0.5;cursor:not-allowed;}
  .cancel-btn{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;padding:16px 20px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:border-color 0.2s,color 0.2s;}
  .cancel-btn:hover{border-color:var(--muted);color:var(--text);}

  .spinner{width:14px;height:14px;border:2px solid rgba(0,0,0,0.3);border-top-color:#000;border-radius:50%;animation:spin 0.6s linear infinite;}

  /* Toast */
  .toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#000;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:0.1em;padding:14px 28px;z-index:2000;transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1);pointer-events:none;white-space:nowrap;}
  .toast.show{transform:translateX(-50%) translateY(0);}
  .toast.error{background:var(--live);color:#fff;}

  /* Footer */
  footer{border-top:1px solid var(--border);padding:40px;max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
  .footer-brand{font-size:18px;font-weight:900;color:var(--muted);}
  .footer-note{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:0.1em;}
  .no-results{text-align:center;padding:80px 0;color:var(--muted);font-family:'Space Mono',monospace;font-size:13px;letter-spacing:0.1em;display:none;}

  /* ── Tablet (max 900px) ── */
  @media (max-width:900px){
    header{padding:60px 28px 44px;} main{padding:40px 28px;} .filter-bar{padding:16px 28px;} footer{padding:32px 28px;}
    .event-inner{grid-template-columns:140px 1fr auto;}
    .event-date-col{padding:20px 16px;} .event-date{font-size:22px;}
    .event-main{padding:20px;} .event-right{padding:20px 16px;min-width:100px;}
    .event-detail.open{padding:28px 28px 28px 156px;}
  }

  /* ── Mobile (max 600px) ── */
  @media (max-width:600px){
    header{padding:40px 16px 36px;}
    h1{font-size:clamp(36px,12vw,56px);}
    .subtitle{font-size:11px;}
    .header-meta{gap:20px;margin-top:28px;} .meta-value{font-size:18px;}
    .filter-bar{padding:12px 16px;gap:8px;} .filter-btn{padding:6px 12px;font-size:10px;}
    main{padding:24px 16px;}
    .event-card:hover{transform:none;}
    .event-inner{grid-template-columns:1fr;}
    .event-date-col{border-right:none;border-bottom:1px solid var(--border);flex-direction:row;align-items:center;padding:14px 16px;justify-content:space-between;gap:0;}
    .event-date{font-size:18px;} .event-month-day,.event-time{margin-top:0;font-size:10px;}
    .event-main{padding:16px 16px 12px;gap:8px;}
    .event-title{font-size:15px;line-height:1.4;} .event-instructor{font-size:12px;}
    .event-description{font-size:12px;-webkit-line-clamp:3;}
    .event-right{border-left:none;border-top:none;padding:0 16px 14px;flex-direction:row;justify-content:flex-start;gap:10px;min-width:unset;}
    .arrow-icon{display:none;}
    .event-detail.open{padding:20px 16px;max-height:600px;}
    .detail-core{font-size:13px;line-height:1.8;}
    .register-btn{width:100%;justify-content:center;padding:14px 20px;font-size:11px;}
    .week-divider{padding:20px 0 8px;font-size:9px;letter-spacing:0.2em;}
    .modal-overlay{align-items:flex-end;}
    .modal{margin:0;max-width:100%;transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);}
    .modal-overlay.open .modal{transform:translateY(0);}
    .modal-header{padding:20px 20px 16px;} .modal-title{font-size:14px;max-width:unset;}
    .modal-body{padding:16px 20px;gap:16px;} .form-input{padding:12px 14px;font-size:14px;}
    .modal-footer{padding:0 20px 24px;} .submit-btn{padding:14px;font-size:11px;} .cancel-btn{padding:14px 16px;font-size:10px;}
    .toast{font-size:11px;padding:12px 20px;width:90%;text-align:center;white-space:normal;}
    footer{padding:24px 16px;flex-direction:column;align-items:flex-start;gap:8px;} .footer-brand{font-size:15px;}
  }

  @media (max-width:380px){
    h1{font-size:32px;} .event-date{font-size:16px;} .event-title{font-size:14px;}
  }
</style>
</head>
<body>

<header>
  <div class="header-grid"></div>
  <div class="header-glow"></div>
  <div class="header-inner">
    <div class="eyebrow">未來學院 · Future Academy</div>
    <h1>每月<span>大師講堂 x 直播</span></h1>
    <p class="subtitle">// LECTURE SERIES · ONLINE</p>
    <div class="header-meta">
      <div class="meta-item"><span class="meta-label">場次總數</span><span class="meta-value" id="stat-total">—</span></div>
      <div class="meta-item"><span class="meta-label">直播場次</span><span class="meta-value" id="stat-live">—</span></div>
      <div class="meta-item"><span class="meta-label">實戰直播場次</span><span class="meta-value" id="stat-practice">—</span></div>
      <div class="meta-item"><span class="meta-label">大師講堂場次</span><span class="meta-value" id="stat-hall">—</span></div>
    </div>
  </div>
</header>

<div class="filter-wrap">
  <div class="filter-bar" id="filter-bar">
    <span class="filter-label">篩選</span>
    <!-- 動態產生 -->
  </div>
</div>

<main>
  <div class="events-list" id="events-list">
    <div class="loading-state" id="loading-state">
      <div class="loading-ring"></div>
      <div class="loading-text">// 載入活動資料中</div>
    </div>
  </div>
  <div class="no-results" id="no-results">// 沒有符合條件的場次</div>
</main>

<footer>
  <div class="footer-brand">未來學院</div>
</footer>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-label">報名登記 · REGISTRATION</div>
        <div class="modal-title" id="modal-event-title">—</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">活動 ID</label>
        <input class="form-input" id="field-event-id" type="text" readonly>
      </div>
      <div class="form-group">
        <label class="form-label">姓名 <span style="color:var(--live)">*</span></label>
        <input class="form-input" id="field-name" type="text" placeholder="請輸入您的姓名" autocomplete="name">
      </div>
      <div class="form-group">
        <label class="form-label">Email <span style="color:var(--live)">*</span></label>
        <input class="form-input" id="field-email" type="email" placeholder="example@email.com" autocomplete="email">
        <span class="form-hint">// 系統將驗證您的 AI 未來學院方案資格</span>
      </div>
      <div class="form-group">
        <label class="form-label">推薦碼 <span style="color:var(--muted);font-weight:normal;letter-spacing:0;text-transform:none;">（選填）</span></label>
        <input class="form-input" id="field-referral" type="text" placeholder="若有推薦碼請填寫" autocomplete="off">
        <span class="form-hint">// 訂閱「每日 AI 知識庫」學員可填入專屬推薦碼</span>
      </div>
    </div>
    <div class="modal-footer">
      <button class="cancel-btn" onclick="closeModal()">取消</button>
      <button class="submit-btn" id="submit-btn" onclick="submitRegistration()">
        <span id="submit-label">確認報名</span>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ════════════════════════════════════════════════
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbz0Gtm_CwNEHHRMjyIX3HES7ezQfdPonMWAc3iFr6L1FmXmXvoal6JpYhiFRGSettyI/exec';
  // ════════════════════════════════════════════════

  const WEEK_DAYS = ['日','一','二','三','四','五','六'];
  const WEEK_DAYS_EN = ['SUN','MON','TUE','WED','THU','FRI','SAT'];

  let allEvents = [];
  let currentCard = null;
  let currentFilter = 'all';

  // ── 載入活動 ──────────────────────────────────
  async function loadEvents() {
    let json;
    try {
      const res = await fetch(GAS_URL + '?action=events');
      json = await res.json();
    } catch (err) {
      safeSetHTML('events-list', '<div class="error-state"><p>// 網路錯誤，請稍後再試</p><button class="retry-btn" onclick="loadEvents()">重新載入</button></div>');
      return;
    }

    if (!json || !json.ok) {
      safeSetHTML('events-list', '<div class="error-state"><p>// API 錯誤：' + (json && json.error || '未知') + '</p><button class="retry-btn" onclick="loadEvents()">重新載入</button></div>');
      return;
    }

    allEvents = (json.data || []).filter(e => e['活動 ID'] && e['標題']);

    try { renderForFilter(); } catch(e) { console.error('renderForFilter error:', e); }
    try { updateStats(allEvents); } catch(e) { console.error('updateStats error:', e); }
    try { buildFilterBar(allEvents); } catch(e) { console.error('buildFilterBar error:', e); }
    try { updateFooterTime(); } catch(e) { console.error('updateFooterTime error:', e); }
  }

  function safeSetHTML(id, html) {
    const el = document.getElementById(id);
    if (el) el.innerHTML = html;
  }

  function safeSetText(id, text) {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  function updateStats(events) {
    safeSetText('stat-total',    events.length);
    safeSetText('stat-live',     events.filter(e => e['類型'] === '直播').length);
    safeSetText('stat-practice', events.filter(e => e['類型'] === '實戰直播').length);
    safeSetText('stat-hall',     events.filter(e => e['類型'] === '大師講堂').length);
  }

  function buildFilterBar(events) {
    const bar = document.getElementById('filter-bar');
    if (!bar) return;
    // 類型只取「未過時」場次的類型（過往的不影響上方篩選）
    const upcoming = events.filter(e => !isPast(e));
    const types = [...new Set(upcoming.map(e => e['類型']).filter(Boolean))];
    bar.innerHTML = '<span class="filter-label">篩選</span>';
    // 全部按鈕
    const allBtn = document.createElement('button');
    allBtn.className = 'filter-btn' + (currentFilter === 'all' ? ' active' : '');
    allBtn.textContent = '全部';
    allBtn.onclick = () => filterEvents('all', allBtn);
    bar.appendChild(allBtn);
    // 各類型
    types.forEach(type => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn' + (currentFilter === type ? ' active' : '');
      btn.textContent = type;
      btn.onclick = () => filterEvents(type, btn);
      bar.appendChild(btn);
    });
    // 過完講堂（只有真的有過往場次才顯示；點了才看得到過往資訊）
    if (events.some(isPast)) {
      const pastBtn = document.createElement('button');
      pastBtn.className = 'filter-btn filter-btn-past' + (currentFilter === 'past' ? ' active' : '');
      pastBtn.textContent = '過完講堂';
      pastBtn.onclick = () => filterEvents('past', pastBtn);
      bar.appendChild(pastBtn);
    }
  }

  function updateFooterTime() {
    const now = new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' });
    safeSetText('footer-time', '最後更新 · ' + now);
  }

  function showError(msg) {
    safeSetHTML('events-list', '<div class="error-state"><p>// 無法載入活動資料：' + (msg || '請稍後再試') + '</p><button class="retry-btn" onclick="loadEvents()">重新載入</button></div>');
  }

  // ── 解析日期 ──────────────────────────────────
  function parseDate(raw) {
    if (!raw) return null;
    const s = String(raw);
    const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (iso) return new Date(+iso[1], +iso[2] - 1, +iso[3]);
    const slash = s.match(/(\d{4})\/(\d{2})\/(\d{2})/);
    if (slash) return new Date(+slash[1], +slash[2] - 1, +slash[3]);
    return null;
  }

  function parseTime(raw) {
    if (!raw) return '';
    const s = String(raw);
    const iso = s.match(/T(\d{2}):(\d{2})/);
    if (iso) return `${iso[1]}:${iso[2]}`;
    const hm = s.match(/(\d{1,2}):(\d{2})/);
    if (hm) return `${String(hm[1]).padStart(2,'0')}:${hm[2]}`;
    return s;
  }

  // ── 判斷場次是否已過時（用 日期 + 結束時間；沒結束時間就用開始時間，再不然算當天結束）──
  function eventEndDate(ev) {
    const d = parseDate(ev['日期']);
    if (!d) return null;            // 無法解析日期 → 不當成過往，照常顯示
    const t = parseTime(ev['結束時間']) || parseTime(ev['開始時間']) || '23:59';
    const m = String(t).match(/(\d{1,2}):(\d{2})/);
    const end = new Date(d);
    if (m) end.setHours(+m[1], +m[2], 0, 0); else end.setHours(23, 59, 0, 0);
    return end;
  }
  function isPast(ev) {
    const e = eventEndDate(ev);
    return e ? e.getTime() < Date.now() : false;
  }

  function getWeekLabel(date) {
    const month = date.getMonth() + 1;
    const day   = date.getDate();
    const firstDay = new Date(date.getFullYear(), date.getMonth(), 1).getDay();
    const weekNum  = Math.ceil((day + (firstDay === 0 ? 6 : firstDay - 1)) / 7);
    const weekCn   = ['一','二','三','四','五'][weekNum - 1] || weekNum;
    return `${String(month).padStart(2,'0')}月 · 第${weekCn}週`;
  }

  // ── 渲染活動列表 ──────────────────────────────
  function renderEvents(events, pastMode) {
    const list = document.getElementById('events-list');
    list.innerHTML = '';

    if (!events.length) {
      document.getElementById('no-results').style.display = 'block';
      return;
    }
    document.getElementById('no-results').style.display = 'none';

    const sorted = [...events].sort((a, b) => {
      const da = parseDate(a['日期']), db = parseDate(b['日期']);
      if (!da || !db) return 0;
      if (da - db !== 0) return da - db;
      return (a['開始時間'] || '').localeCompare(b['開始時間'] || '');
    });
    if (pastMode) sorted.reverse();   // 過往場次：最近的在最前面

    let lastWeek = '';
    sorted.forEach((ev, i) => {
      const date = parseDate(ev['日期']);
      const weekLabel = date ? getWeekLabel(date) : '';

      if (weekLabel && weekLabel !== lastWeek) {
        const div = document.createElement('div');
        div.className = 'week-divider';
        div.textContent = weekLabel;
        list.appendChild(div);
        lastWeek = weekLabel;
      }

      const card = buildCard(ev, i, date);
      list.appendChild(card);
    });
  }

  function buildCard(ev, i, date) {
    const id         = String(ev['活動 ID'] || '');
    const title      = ev['標題'] || '';
    const instructor = ev['講師'] || '';
    const location   = ev['地點'] || '線上';
    const type       = ev['類型'] || '';
    const core       = ev['主題核心'] || '';
    const startTime  = parseTime(ev['開始時間']);
    const endTime    = parseTime(ev['結束時間']);
    const timeRange  = startTime && endTime ? `${startTime} – ${endTime}` : startTime;

    const dateStr   = date ? `${String(date.getMonth()+1).padStart(2,'0')}/${String(date.getDate()).padStart(2,'0')}` : '';
    const weekDayCn = date ? `週${WEEK_DAYS[date.getDay()]}` : '';
    const weekDayEn = date ? WEEK_DAYS_EN[date.getDay()] : '';

    const typeCls  = type === '直播' ? 'type-live' : 'type-hall';
    const descHtml = core ? `<div class="event-description">${esc(core)}</div>` : '';
    const coreHtml = core ? `<div class="detail-core">${esc(core)}</div>` : '';

    const card = document.createElement('div');
    card.className = 'event-card';
    card.dataset.type  = type;
    card.dataset.id    = id;
    card.dataset.title = title;
    card.style.animationDelay = `${Math.min(i, 9) * 0.05}s`;

    card.innerHTML = `
      <div class="event-inner">
        <div class="event-date-col">
          <div class="event-date">${dateStr}</div>
          <div class="event-month-day">${weekDayCn} · ${weekDayEn}</div>
          <div class="event-time">${timeRange}</div>
        </div>
        <div class="event-main">
          <span class="event-type-badge ${typeCls}"><span class="type-dot"></span>${esc(type)}</span>
          <div class="event-title">${esc(title)}</div>
          <div class="event-meta-row">
            <span class="event-instructor">${esc(instructor)}</span>
            <span class="event-location">📍 ${esc(location)}</span>
          </div>
          ${descHtml}
        </div>
        <div class="event-right">
          <div class="reg-badge">已報名</div>
          <div class="arrow-icon">→</div>
        </div>
      </div>
      <div class="event-detail">
        <div class="detail-id">// EVENT ID · ${esc(id)}</div>
        ${coreHtml}
        <button class="register-btn" onclick="openModal(this)">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          立即報名
        </button>
      </div>`;

    card.addEventListener('click', e => {
      if (e.target.closest('.register-btn')) return;
      const detail = card.querySelector('.event-detail');
      const isOpen = detail.classList.contains('open');
      document.querySelectorAll('.event-detail.open').forEach(d => d.classList.remove('open'));
      if (!isOpen) detail.classList.add('open');
    });

    return card;
  }

  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Filter ──────────────────────────────────
  function filterEvents(type, btn) {
    currentFilter = type;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderForFilter();
  }

  // 依目前篩選決定要顯示哪些場次：預設只顯示「未過時」；選「過完講堂」才顯示過往
  function renderForFilter() {
    if (currentFilter === 'past') {
      renderEvents(allEvents.filter(isPast), true);
    } else {
      const upcoming = allEvents.filter(e => !isPast(e));
      const list = currentFilter === 'all' ? upcoming : upcoming.filter(e => e['類型'] === currentFilter);
      renderEvents(list, false);
    }
  }

  // ── Modal ────────────────────────────────────
  function openModal(btn) {
    currentCard = btn.closest('.event-card');
    document.getElementById('modal-event-title').textContent = currentCard.dataset.title;
    document.getElementById('field-event-id').value = currentCard.dataset.id;
    document.getElementById('field-name').value = '';
    document.getElementById('field-email').value = '';
    document.getElementById('field-referral').value = '';
    setSubmitLoading(false);
    document.getElementById('modal-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
    setTimeout(() => document.getElementById('field-name').focus(), 280);
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // ── Submit (兩段式：先驗資格，再寫入) ─────────────────────
  async function submitRegistration() {
    const name         = document.getElementById('field-name').value.trim();
    const email        = document.getElementById('field-email').value.trim();
    const referralCode = document.getElementById('field-referral').value.trim();
    const eventId      = document.getElementById('field-event-id').value;

    if (!name)  { showToast('請填寫姓名', true); return; }
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showToast('請填寫有效的 Email', true); return; }

    setSubmitLoading(true);

    try {
      // ── Stage 1: 檢查資格（Kolable + 推薦碼）
      const checkUrl = GAS_URL + '?action=check-eligibility'
        + '&email='        + encodeURIComponent(email)
        + '&eventId='      + encodeURIComponent(eventId)
        + '&referralCode=' + encodeURIComponent(referralCode);
      const checkRes = await fetch(checkUrl);
      const result   = await checkRes.json();

      if (!result.ok) {
        showToast(result.error || '系統錯誤，請稍後再試', true);
        setSubmitLoading(false);
        return;
      }
      if (!result.eligible) {
        showToast(result.reason || '不符合報名資格', true);
        setSubmitLoading(false);
        return;
      }

      // ── Stage 2: 通過資格 → 寫入報名紀錄
      // 推薦碼只在實際被採用時才記錄（result.plan 含「推薦碼」字串）
      const codeApplied = (result.plan && result.plan.indexOf('推薦碼') !== -1) ? referralCode : '';
      const ts = new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' });
      const regUrl = GAS_URL + '?' + new URLSearchParams({
        action: 'register', ts: ts, email: email, name: name, eventId: eventId,
        referralCode: codeApplied
      }).toString();
      const regRes  = await fetch(regUrl);
      const regJson = await regRes.json().catch(() => null);

      // 重複報名（GAS 端擋下）
      if (regJson && regJson.duplicate) {
        showToast('您已報名過此活動', true);
        setSubmitLoading(false);
        return;
      }
      if (regJson && !regJson.ok) {
        showToast(regJson.error || '寫入失敗', true);
        setSubmitLoading(false);
        return;
      }

      // 成功 UI 更新
      if (currentCard) {
        currentCard.classList.add('registered');
        const regBtn = currentCard.querySelector('.register-btn');
        if (regBtn) {
          regBtn.textContent = '✓ 已報名';
          regBtn.classList.add('done');
          regBtn.onclick = null;
        }
      }
      closeModal();
      showToast('✓ 報名成功（' + result.plan + '）');
    } catch (err) {
      showToast('連線錯誤：' + (err.message || err), true);
    } finally {
      setSubmitLoading(false);
    }
  }

  function setSubmitLoading(on) {
    const btn = document.getElementById('submit-btn');
    btn.disabled = on;
    document.getElementById('submit-label').innerHTML = on ? '<div class="spinner"></div>' : '確認報名';
  }

  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error' : '');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
  }

  // ── Init ─────────────────────────────────────
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadEvents);
  } else {
    loadEvents();
  }
</script>
</body>
</html>
